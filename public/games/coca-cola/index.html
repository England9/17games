<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Coca-Cola · 17 Games</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./game.css" />
  </head>
  <body>
    <div class="shell">
      <header class="bar">
        <a class="back" href="/">← 17 Games</a>
        <h1>Coca-Cola</h1>
        <div class="scoreboard">
          <span>Score <strong id="score">0</strong></span>
          <span>Best <strong id="best">0</strong></span>
        </div>
      </header>
      <main class="playfield">
        <canvas id="game" width="420" height="640" aria-label="Coca-Cola game"></canvas>
        <div class="hud" id="hud">
          <p class="title">Coca-Cola</p>
          <p class="hint">Tap, click, or press Space to float the can</p>
          <button type="button" id="startBtn">Open a cold one</button>
        </div>
      </main>
    </div>
    <script type="module" src="./game.js"></script>
  </body>
</html>
